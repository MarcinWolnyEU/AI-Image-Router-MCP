version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    # Ignore only versions that cannot run on the Node 20.7 floor: @types/node 22+
    # describes Node 22 APIs (newer than the floor) and sharp 0.35+ requires Node
    # >=20.9.0. TypeScript releases declare Node >=14.17 (5.x/6.x) or >=16.20.0
    # (7.x), so it stays visible and its major bumps are validated by CI.
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 22.0.0"]
      - dependency-name: "sharp"
        versions: [">= 0.35.0"]
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]
