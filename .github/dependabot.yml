version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
    # Node and TypeScript are pinned deliberately: the runtime floor is Node 20.7,
    # and the MCP v2 packages target TypeScript 5.x. Major bumps (e.g. @types/node 26,
    # typescript 7) are not applicable to this project.
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "@types/node"
    groups:
      npm-dependencies:
        patterns: ["*"]
        exclude-patterns: ["typescript", "@types/node"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci, include: scope }
    groups:
      actions:
        patterns: ["*"]
